# $schema: https://json.schemastore.org/github-workflow.json

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build Phragen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Build
        run: mise tasks run --silent build:release-all

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: zig-out/release/
          if-no-files-found: error

  release:
    name: Publish GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - build
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_NOTES_FILE: release-notes.md
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist/

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binaries
        working-directory: dist
        run: |
          for file in *; do
            cosign sign-blob "${file}" \
              --bundle "${file}.sigstore.json" \
              --yes
          done

      - name: Verify vinaries
        working-directory: dist
        run: |
          for file in *; do
            [[ "${file}" == *.sigstore.json ]] && continue

            cosign verify-blob "${file}" \
              --bundle "${file}.sigstore.json" \
              --certificate-identity="${REPO_URL}/.github/workflows/release.yaml@refs/heads/main" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          done

      - name: Fetch tags forcely
        run: git fetch --tags --force

      - name: Write release notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname \
            | awk -v tag="${RELEASE_TAG}" '$0 == tag { found=1; next } found { print; exit }')
          RANGE="${PREV_TAG:+${PREV_TAG}..}${RELEASE_TAG}"

          COMMITS=$(git log "${RANGE}" --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))" \
            | grep --extended-regexp '^- (feat|fix|perf)(\([^)]+\))?!?:' || true)

          if [ -n "${PREV_TAG}" ]; then
            ALL_CHANGES_URL="${REPO_URL}/compare/${PREV_TAG}...${RELEASE_TAG}"
          else
            ALL_CHANGES_URL="${REPO_URL}/commits/${RELEASE_TAG}"
          fi

          cat > "${RELEASE_NOTES_FILE}" <<EOF
          ## Summary

          $(git for-each-ref refs/tags/"${RELEASE_TAG}" --format="%(contents:body)")

          ## Changes

          This release includes the following commits to relevant to users. 

          ${COMMITS}

          You can see the full changelog since the previous release [here](${ALL_CHANGES_URL}).
          EOF

      - name: Create release
        run: |
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-file "${RELEASE_NOTES_FILE}" \
            dist/*
