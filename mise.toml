#:schema https://mise.en.dev/schema/mise.json

[tools]
zig = "0.16.0"

[tasks.build]
description = "Build"
run = "zig build --summary all"

[tasks."build:full"]
description = "Full rebuild"
run = [
  "rm --recursive --force ./.zig-cache/",
  "zig build --summary all -fno-incremental"
]

[tasks."build:report"]
description = "Full rebuild and generate compilation time report"
run = [
  "rm --recursive --force ./.zig-cache/",
  "zig build --summary all -fno-incremental --webui=[::1]:3333 --time-report"
]

[tasks."build:release"]
description = "Build the release binary for your platform"
run = "zig build release --summary all"

[tasks."build:release-all"]
description = "Build release binaries for all supported platform"
run = "zig build release -Dtarget-all=true --summary all"

[tasks.test]
description = "Run tests by building a test executable"
usage = '''
arg "[filter]" help="Filter tests to run"
'''
run = "zig build test --summary all -- ${usage_filter}"
